name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Test · Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # Every check below runs even if an earlier one fails (`if: always()`), so a
      # PR author sees every problem in one pass instead of discovering them
      # serially across three pushes. The job still fails if any step failed.
      - name: Typecheck
        id: typecheck
        run: npx tsc --noEmit

      - name: Test
        if: always() && steps.typecheck.outcome != 'cancelled'
        run: npx vitest run --reporter=verbose

      # Ratchet: the ceiling sits just above the current count (143 — of which
      # 108 are the accessibility rule). Lower it every sprint rather than
      # declaring a flag day; see docs/accessibility.md for the burn-down order.
      # Errors are always fatal regardless of this number.
      #
      # 165 → 148: `import/first` is now off for test files (eslint.config.js),
      # which retired 21 warnings no one could action. Ratchets only work if
      # they follow the count DOWN — leaving the old ceiling would have banked
      # the win as slack and let 20 new warnings in unnoticed.
      - name: Lint
        if: always() && steps.typecheck.outcome != 'cancelled'
        run: npx eslint . --max-warnings=148

      # Report-only for now. Dead code accumulates fastest post-refactor /
      # pre-launch, which is exactly where this project is. Flip to a hard gate
      # once the reported baseline is clean.
      - name: Dead-code guard
        if: always() && steps.typecheck.outcome != 'cancelled'
        run: npx knip --no-exit-code

      # Catches anything that breaks the real Metro build but not tsc — a bad
      # import path, a missing asset, a native-only module pulled into a shared
      # file. This is the check that would have caught a bad dead-code deletion.
      - name: Bundle
        if: always() && steps.typecheck.outcome != 'cancelled'
        run: npx expo export --platform ios --output-dir /tmp/bundle-check

  schema:
    name: DB types are current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Fails the build when the live schema and the checked-in types diverge —
      # the drift class that let the DB accept an activity_level the app's union
      # didn't have. Skips (rather than fails) when the secrets aren't set, so
      # forks and contributors without DB access still get a green CI.
      - name: Compare generated types against lib/database.types.ts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_ID" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_ID not set — skipping schema drift check."
            exit 0
          fi
          npx supabase gen types typescript --project-id "$PROJECT_ID" > /tmp/types.ts
          if ! diff -u lib/database.types.ts /tmp/types.ts; then
            echo "::error::Schema drift: regenerate with 'npx supabase gen types typescript --project-id \$PROJECT_ID > lib/database.types.ts'"
            exit 1
          fi
